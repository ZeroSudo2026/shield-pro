<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShieldPro - نظام الحماية والوقاية الآلي</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 40px;
            max-width: 550px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .badge {
            background-color: #0284c7;
            color: #ffffff;
            font-size: 12px;
            padding: 6px 16px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: inline-block;
            margin-bottom: 20px;
            font-weight: bold;
        }
        h1 {
            font-size: 28px;
            color: #38bdf8;
            margin-bottom: 15px;
        }
        p {
            color: #94a3b8;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn-download {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white;
            padding: 14px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
        }
        .btn-download:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        .footer-text {
            margin-top: 25px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="card">
        <span class="badge">ShieldPro IPS & Suite</span>
        <h1>برنامج ShieldPro للوقاية والحماية</h1>
        <p>نظام أمني متكامل لحماية الشبكات والأجهزة، يوفر حلول الوقاية التلقائية وإدارة تراخيص الأمان بسهولة واحترافية.</p>
        
        <div class="btn-container">
            <!-- مسار مباشر لملف app داخل المستودع مع خاصية download -->
            <a href="./app" download="ShieldPro.exe" class="btn-download">
                📥 تحميل البرنامج الآن (PC)
            </a>
        </div>

        <p class="footer-text">إصدار تجريبي جاهز للتحميل والتشغيل على الحاسوب.</p>
    </div>

</body>
</html>
