.<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShieldPro - نظام الحماية والوقاية الآلي</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .badge {
            background-color: #2563eb;
            color: #fff;
            font-size: 12px;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        h1 {
            font-size: 26px;
            margin-bottom: 15px;
            color: #38bdf8;
        }
        p {
            color: #94a3b8;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn-download {
            display: inline-block;
            background-color: #0284c7;
            color: white;
            text-decoration: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
            width: 100%;
        }
        .btn-download:hover {
            background-color: #0369a1;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(2, 132, 199, 0.6);
        }
        .sub-text {
            margin-top: 15px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="card">
        <span class="badge">ShieldPro IPS & Suite</span>
        <h1>برنامج ShieldPro للوقاية والحماية</h1>
        <p>نظام أمني متكامل لحماية الشبكات والأجهزة، يوفر حلول الوقاية التلقائية وإدارة تراخيص الأمان بسهولة واحترافية.</p>
        
        <!-- رابط التحميل المباشر لملف app.exe -->
        <a href="app.exe" download="ShieldPro.exe" class="btn-download">
            📥 تحميل البرنامج الآن (PC)
        </a>
        
        <div class="sub-text">إصدار تجريبي جاهز للتحميل والتغشيل على الحاسوب.</div>
    </div>

</body>
</html>
